<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContractGen</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Prism -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
    />

    <link rel="stylesheet" href="/static/style.css" />

    <!-- HTMX -->
    <script defer src="https://unpkg.com/htmx.org@2.0.3"></script>

    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <header>
      <h1>ContractGen</h1>
    </header>

    <main class="form-area">
      <form hx-post="/generate" hx-target="#results" hx-swap="innerHTML">
        <label for="yaml">Contract YAML</label>
        <!-- prettier-ignore -->
        <textarea name="yaml" id="yaml" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Paste your YAML here...">{{.Example}}</textarea>
        <button type="submit">Generate</button>
      </form>
    </main>

    <section class="results-area" id="results">
      <!-- HTMX swaps results.html -->
    </section>
  </body>
</html>
