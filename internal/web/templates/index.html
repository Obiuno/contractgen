<!DOCTYPE html>
<html>
<head>
  <title>ContractGen</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 300px; font-family: monospace; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>ContractGen</h1>
  <form hx-post="/generate" hx-target="#results" hx-swap="innerHTML">
    <label for="yaml">Write or paste your contract YAML:</label>
    <textarea name="yaml" id="yaml" placeholder="contract: ...">{{.Example}}</textarea>
    <button type="submit">Generate</button>
  </form>
  <div id="results"></div>
</body>
</html>
