version: "1.0"
description: "Core logic for processing customer transactions"
tables:
  - name: "customer_orders"
    description: "Tracks all successful checkout events"
    columns:
      - name: "id"
        type: "uuid"
        constraints: ["primary_key", "not_null"]
      - name: "order_value"
        type: "decimal"
        constraints: ["not_null"]
