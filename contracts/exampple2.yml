version: "1.0"
description: "E-commerce platform schema for testing ContractGen"

tables:
  - name: "customers"
    description: "Customer master data"
    columns:
      - name: "id"
        type: "uuid"
        constraints: ["primary_key", "not_null"]
      - name: "email"
        type: "varchar"
        constraints: ["not_null", "unique"]
      - name: "name"
        type: "varchar"
        constraints: ["not_null"]
      - name: "phone"
        type: "varchar"
        constraints: []
      - name: "created_at"
        type: "timestamp"
        constraints: ["not_null"]

  - name: "products"
    description: "Product catalog"
    columns:
      - name: "id"
        type: "uuid"
        constraints: ["primary_key", "not_null"]
      - name: "sku"
        type: "varchar"
        constraints: ["not_null", "unique"]
      - name: "name"
        type: "varchar"
        constraints: ["not_null"]
      - name: "price"
        type: "decimal"
        constraints: ["not_null"]

  - name: "orders"
    description: "Customer orders"
    columns:
      - name: "id"
        type: "uuid"
        constraints: ["primary_key", "not_null"]
      - name: "customer_id"
        type: "uuid"
        constraints: ["not_null"]
        references:
          table: "customers"
          column: "id"
      - name: "order_total"
        type: "decimal"
        constraints: ["not_null"]
      - name: "status"
        type: "varchar"
        constraints: ["not_null"]
      - name: "created_at"
        type: "timestamp"
        constraints: ["not_null"]

  - name: "order_items"
    description: "Line items for each order"
    columns:
      - name: "id"
        type: "uuid"
        constraints: ["primary_key", "not_null"]
      - name: "order_id"
        type: "uuid"
        constraints: ["not_null"]
        references:
          table: "orders"
          column: "id"
      - name: "product_id"
        type: "uuid"
        constraints: ["not_null"]
        references:
          table: "products"
          column: "id"
      - name: "quantity"
        type: "integer"
        constraints: ["not_null"]
      - name: "unit_price"
        type: "decimal"
        constraints: ["not_null"]
